# Live group assessments (join code / QR, shared timer, class results).
# Deploy:  cd workers/assessment-session && npm install && npx wrangler deploy
# Durable Objects with the SQLite backend are available on the Workers Free plan.
name = "assessment-session"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "AssessmentSession"

[[durable_objects.bindings]]
name = "ADMIN_GUARD"
class_name = "AdminGuard"

[[durable_objects.bindings]]
name = "FORUM_QUEUE"
class_name = "ForumQueue"

[[durable_objects.bindings]]
name = "RESULTS"
class_name = "ResultsStore"

[[durable_objects.bindings]]
name = "ACTIVITIES"
class_name = "ClassActivity"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AssessmentSession"]

# Failed-login limiter for /api/admin/login.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["AdminGuard"]

# Forum posts waiting for the teacher's approval.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["ForumQueue"]

# Permanent assessment results record (individual + group).
[[migrations]]
tag = "v4"
new_sqlite_classes = ["ResultsStore"]

# Classroom activities (Shared Wall, Word Cloud, Poll, Survey, Think/Pair/Share, Vote).
[[migrations]]
tag = "v5"
new_sqlite_classes = ["ClassActivity"]

# Admin publishing secrets (never committed):
#   npx wrangler secret put GITHUB_PAT              (fine-grained token: Contents read/write on this repo)
#   npx wrangler secret put ADMIN_PASSWORD_SHA256   (sha256 hex of the admin password)
#   npx wrangler secret put SESSION_SIGNING_KEY     (random; changing it signs every device out)

# Optional: require a teacher secret to create sessions.
#   npx wrangler secret put HOST_SECRET
# (then enter the same value in Admin → Assessments → Start group session)
