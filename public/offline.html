<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b3a57">
<title>Offline | Shaiq Muhammad</title>
<style>
  html,body{margin:0;height:100%;background:#fff8ec;color:#1b2f44;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
  .bar{background:#1b3a57;height:56px}
  main{max-width:28rem;margin:0 auto;padding:3rem 1.5rem;text-align:center}
  img{width:96px;height:96px;border-radius:50%;border:4px solid #f2c75c}
  h1{font-size:1.6rem;margin:1rem 0 .5rem;color:#1b3a57}
  p{line-height:1.5;opacity:.85}
  button{margin-top:1.25rem;border:2px solid #e9b949;background:#f2c75c;color:#0b1b2b;font-weight:800;font-size:1.05rem;border-radius:999px;padding:.75rem 1.75rem;cursor:pointer}
  .ar{direction:rtl;margin-top:2rem;opacity:.8}
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>No internet connection right now. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <p class="ar">لا يوجد اتصال بالإنترنت حاليًا. تحقّق من الشبكة ثم حاول مجددًا.</p>
</main>
</body>
</html>
